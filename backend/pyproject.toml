[project]
name = "mensageiro-backend"
version = "0.1.0"
description = "Backend (API + worker) do Mensageiro — mensagens agendadas no WhatsApp Cloud API."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "psycopg[binary]>=3.3",
    "httpx>=0.28",
    "pyotp>=2.9",
    "phonenumbers>=9.0.42",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.33",
    "python-dateutil>=2.9",
    "cryptography>=43",
    "sentry-sdk>=2.0",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.17",
    "mypy>=1.13",
    "types-python-dateutil>=2.9.0.20261104",
]

[tool.ruff]
line-length = 110
target-version = "py314"
# Arquivos de migração são gerados pelo Alembic (boilerplate op/sa, typing legado); revisados
# à mão no /migracao, não pelo linter. O env.py (hand-maintained) continua lintado.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Depends/Header/etc. em defaults são o padrão idiomático do FastAPI, não o bug que o B008 visa.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Rigor máximo onde o domínio é crítico (CLAUDE.md §8).
[[tool.mypy.overrides]]
module = ["app.services.*", "app.worker.*"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
# Gate de cobertura mede as REGRAS de domínio (CLAUDE.md §8 / spec 0001 AC-2: "regras ≥90%").
# `criar_admin` é bootstrap/CLI (rodado à mão no 1º acesso), não é regra — fica fora do gate.
omit = ["app/criar_admin.py", "migrations/*"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
